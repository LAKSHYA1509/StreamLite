services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${SUPABASE_HOST:-supabase-db}:5432/${SUPABASE_DATABASE:-streamlite}
      - SPRING_DATASOURCE_USERNAME=${SUPABASE_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SUPABASE_PASSWORD:-postgres}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SUPABASE_HOST=${SUPABASE_HOST:-supabase-db}
      - SUPABASE_DATABASE=${SUPABASE_DATABASE:-streamlite}
      - SUPABASE_USER=${SUPABASE_USER:-postgres}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD:-postgres}
    depends_on:
      - supabase-db

  supabase-db:
    image: postgres:15
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${SUPABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${SUPABASE_PASSWORD:-postgres}
      - POSTGRES_DB=${SUPABASE_DATABASE:-streamlite}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
