<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>StreamLite Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-8">

    <h1 class="text-3xl font-bold mb-4">Now Playing</h1>

    <video id="videoPlayer" controls class="w-full max-w-4xl rounded-lg shadow-lg"></video>
    <div class="w-full max-w-4xl mt-6">
    <h2 class="text-2xl font-semibold mb-4">Live Chat</h2>
    <div id="chat-messages" class="h-64 bg-gray-700 p-4 rounded-lg overflow-y-auto mb-4">
    </div>
    <div class="flex">
        <input type="text" id="message-input" class="flex-grow bg-gray-600 text-green p-2 rounded-l-lg focus:outline-none" placeholder="Type a message...">
        <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r-lg">Send</button>
    </div>
</div>
    <script th:inline="javascript">
        console.log("Player page loaded");

        const videoId = /*[[${videoId}]]*/ 'default-video-id';
        const videoPlayer = document.getElementById('videoPlayer');
        
        // Construct the CORRECT URL to your playlist file
        const playlistUrl = `http://localhost:8000/stream/${videoId}/playlist.m3u8`;

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(playlistUrl);
            hls.attachMedia(videoPlayer);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                console.log('Video manifest loaded successfully');
            });
        } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
            videoPlayer.src = playlistUrl;
        }

        /*]]>*/

// --- Chat Functionality ---
const chatMessages = document.getElementById('chat-messages');
const messageInput = document.getElementById('message-input');
const sendButton = document.getElementById('send-button');

// Establish a WebSocket connection to your backend
const socket = new WebSocket('ws://localhost:8000/chat');

// --- WebSocket Event Handlers ---

// Fired when the connection is successfully opened
socket.onopen = function(event) {
    console.log('WebSocket connection opened.');
    chatMessages.innerHTML += '<p class="text-gray-400"><em>Connected to chat!</em></p>';
};

// Fired when a message is received from the server
// Find and REPLACE your old socket.onmessage function with this one

socket.onmessage = function(event) {
    console.log('Message from server:', event.data);

    // --- NEW: Parse the JSON string from the server ---
    const messageData = JSON.parse(event.data);

    // Create the message elements
    const messageElement = document.createElement('p');
    const usernameSpan = document.createElement('span');
    
    // Style the username with the color from the server
    usernameSpan.textContent = messageData.username + ': ';
    usernameSpan.style.color = messageData.color;
    usernameSpan.style.fontWeight = 'bold';

    // Append the username and the message content
    messageElement.appendChild(usernameSpan);
    messageElement.append(document.createTextNode(messageData.content));
    
    chatMessages.appendChild(messageElement);
    chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll
};

// Fired when the connection is closed
socket.onclose = function(event) {
    console.log('WebSocket connection closed.');
    chatMessages.innerHTML += '<p class="text-green-400"><em>Disconnected from chat.</em></p>';
};

// --- Sending Messages ---

function sendMessage() {
    const message = messageInput.value;
    if (message.trim() !== '' && socket.readyState === WebSocket.OPEN) {
        socket.send(message);
        messageInput.value = '';
    } else if (message.trim() !== '' && socket.readyState !== WebSocket.OPEN) {
        chatMessages.innerHTML += '<p class="text-red-400"><em>Chat is not connected. Please refresh the page.</em></p>';
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
}

sendButton.addEventListener('click', sendMessage);
// Allow sending by pressing Enter
messageInput.addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
        sendMessage();
    }
});
    </script>

</body>
</html>
