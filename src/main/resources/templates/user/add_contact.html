<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title>Add Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.2/main.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="content" class="container mx-auto p-4 mt-16"> <!-- Added mt-16 for top margin -->
        <div th:if="${loggedInUser}" class="flex flex-col lg:flex-row gap-6">
            <!-- External Events -->
            <div id="external-events" class="w-full lg:w-64 bg-gray-100 p-4 rounded-lg shadow">
                <h4 class="font-bold mb-4">Draggable Events</h4>
                <div class="fc-event bg-blue-500 text-white p-2 mb-2 rounded cursor-move">My Event 1</div>
                <div class="fc-event bg-green-500 text-white p-2 mb-2 rounded cursor-move">My Event 2</div>
                <div class="mt-4">
                    <input type="checkbox" id="drop-remove" class="mr-2" />
                    <label for="drop-remove">Remove after drop</label>
                </div>
                <!-- Add new event button -->
                <button id="addNewDraggableEvent" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    + Add New Draggable Event
                </button>
            </div>

            <!-- Calendar -->
            <div class="flex-grow">
                <div id="calendar" class="bg-white p-4 rounded-lg shadow"></div>
            </div>
        </div>

        <!-- Event Form Modal -->
        <div id="eventFormModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
            <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                <h2 class="text-xl font-bold mb-4">Add Event</h2>
                <form id="eventForm" class="space-y-4">
                    <div>
                        <label for="event-title" class="block text-sm font-medium text-gray-700">Event Title</label>
                        <input id="event-title" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required />
                    </div>
                    <div>
                        <label for="event-description" class="block text-sm font-medium text-gray-700">Event Description</label>
                        <textarea id="event-description" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required></textarea>
                    </div>
                    <div>
                        <label for="event-date" class="block text-sm font-medium text-gray-700">Event Date</label>
                        <input type="date" id="event-date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required />
                    </div>
                    <div>
                        <label for="event-time" class="block text-sm font-medium text-gray-700">Event Time</label>
                        <input type="time" id="event-time" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required />
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Create Event</button>
                        <button type="button" onclick="closeEventForm()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script>
       document.addEventListener('DOMContentLoaded', function() {
    var containerEl = document.getElementById('external-events');
    var checkbox = document.getElementById('drop-remove');

    // Initialize draggable events
    var Draggable = FullCalendar.Draggable;
    new Draggable(containerEl, {
        itemSelector: '.fc-event',
        eventData: function(eventEl) {
            return {
                title: eventEl.innerText,
                duration: '02:00',
                create: true,
                backgroundColor: eventEl.style.backgroundColor,
                borderColor: eventEl.style.backgroundColor
            };
        }
    });

    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        editable: true,
        droppable: true, // this allows things to be dropped onto the calendar
        dropAccept: '.fc-event',
        eventDragStop: function(info) {
            console.log('Event drag stop:', info);
        },
        drop: function(info) {
            // When an external event is dropped onto the calendar
            console.log('Drop event:', info);
            
            // Create the event on the calendar
            calendar.addEvent({
                title: info.draggedEl.innerText,
                start: info.date,
                allDay: true,
                backgroundColor: info.draggedEl.style.backgroundColor,
                borderColor: info.draggedEl.style.backgroundColor
            });

            // Remove the element from the "External Events" list if the checkbox is checked
            if (checkbox.checked) {
                info.draggedEl.parentNode.removeChild(info.draggedEl);
            }
        },
        eventReceive: function(info) {
            // Called when an external event lands on the calendar
            console.log('Event received:', info.event);
        },
        eventDrop: function(info) {
            // Called when an event is dragged and dropped on the calendar
            console.log('Event dropped:', info.event.start);
        }
    });

    calendar.render();

    // Add new draggable event button handler
    document.getElementById('addNewDraggableEvent').addEventListener('click', function() {
        var newEventTitle = prompt("Enter new event title:");
        if (newEventTitle) {
            var colors = [
                'bg-blue-500',
                'bg-green-500',
                'bg-yellow-500',
                'bg-red-500',
                'bg-purple-500'
            ];
            var randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            var newEvent = document.createElement('div');
            newEvent.className = `fc-event ${randomColor} text-white p-2 mb-2 rounded cursor-move`;
            newEvent.innerText = newEventTitle;
            
            // Add the new event to the external events container
            containerEl.insertBefore(newEvent, document.getElementById('addNewDraggableEvent'));
            
            // Make the new event draggable
            new Draggable(newEvent, {
                eventData: function() {
                    return {
                        title: newEventTitle,
                        duration: '02:00',
                        backgroundColor: newEvent.style.backgroundColor,
                        borderColor: newEvent.style.backgroundColor
                    };
                }
            });
        }
    });
});
    </script>
</body>
</html>
