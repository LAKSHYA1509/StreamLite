<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - StreamLite</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-8">
    <div class="text-center">
        <h1 class="text-4xl font-bold text-red-500 mb-4">Oops! Something went wrong</h1>
        <p class="text-xl mb-6" th:text="${error}">An unexpected error occurred</p>
        <p class="text-gray-300 mb-8" th:text="${message}">We're sorry, but something went wrong. Please try again later.</p>

        <div class="space-x-4">
            <button onclick="history.back()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Go Back
            </button>
            <a href="/" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                Home
            </a>
        </div>
    </div>
</body>
</html>
